name: Atualizar dados do Corinthians

on:
  push:
    branches: [main, master]
    paths:
      - "data-pipeline/scripts/**"
      - "data-pipeline/package.json"
      - "data-pipeline/package-lock.json"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corinthians-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar e validar os dados
        working-directory: data-pipeline
        run: |
          npm ci
          npm run all
      - name: Publicar somente quando houver mudanças
        run: |
          git config user.name "corinthians-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-pipeline/public
          git diff --cached --quiet || git commit -m "chore: atualizar dados dos jogos"
          git push

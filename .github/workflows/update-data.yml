name: Validar dados do Corinthians

on:
  push:
    branches: [main, master]
    paths:
      - "data-pipeline/scripts/**"
      - "data-pipeline/package.json"
      - "data-pipeline/package-lock.json"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar e validar os dados
        working-directory: data-pipeline
        run: |
          npm ci
          npm run all
